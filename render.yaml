# Blueprint Render: Web Service (API) + Static Site (Vite).
# После первого деплоя API скопируйте его URL и задайте VITE_API_URL для фронта, затем пересоберите static site.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aura-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      # Пример после появления URL фронта на Render:
      # CORS_ORIGINS=https://aura-frontend.onrender.com

staticSites:
  - name: aura-frontend
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      # Пример (без завершающего слэша, /api добавится в коде при необходимости):
      # VITE_API_URL=https://aura-backend.onrender.com/api
